<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Shield background -->
  <path d="M25 5 L40 10 L40 25 Q40 35 25 45 Q10 35 10 25 L10 10 Z" fill="url(#logoGradient)" stroke="#fff" stroke-width="1"/>
  <!-- Scales of justice -->
  <g fill="white">
    <!-- Central pole -->
    <rect x="24" y="15" width="2" height="20" rx="1"/>
    <!-- Crossbar -->
    <rect x="15" y="20" width="20" height="1.5" rx="0.75"/>
    <!-- Left scale -->
    <circle cx="18" cy="25" r="3" fill="none" stroke="white" stroke-width="1"/>
    <path d="M15 25 Q18 23 21 25" stroke="white" stroke-width="1" fill="none"/>
    <!-- Right scale -->
    <circle cx="32" cy="25" r="3" fill="none" stroke="white" stroke-width="1"/>
    <path d="M29 25 Q32 23 35 25" stroke="white" stroke-width="1" fill="none"/>
    <!-- Scale chains -->
    <line x1="18" y1="22" x2="18" y2="22" stroke="white" stroke-width="0.5"/>
    <line x1="32" y1="22" x2="32" y2="22" stroke="white" stroke-width="0.5"/>
  </g>
</svg>